name: Publish Foundry release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sources
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build minified module
        run: npm run build -- --tag "${{ github.event.release.tag_name }}"

      - name: Create Foundry ZIP
        run: |
          mkdir -p release
          cd dist
          zip -9 -X -r "../release/retro-crt-terminal.zip" .
          cd ..
          cp dist/module.json release/module.json
          cd release
          sha256sum retro-crt-terminal.zip > retro-crt-terminal.zip.sha256

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release/retro-crt-terminal.zip \
            release/retro-crt-terminal.zip.sha256 \
            release/module.json \
            --clobber
